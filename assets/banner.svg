<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060913" />
      <stop offset="40%" stop-color="#0b1329" />
      <stop offset="80%" stop-color="#0f1f3d" />
      <stop offset="100%" stop-color="#080c18" />
    </linearGradient>

    <!-- Glowing Accent Gradients -->
    <linearGradient id="cyberBlue" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="goldAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>

    <linearGradient id="cardBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    .title-text {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 900;
      letter-spacing: -0.5px;
      fill: #ffffff;
    }
    .subtitle-text {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 500;
      letter-spacing: 0.5px;
      fill: #94a3b8;
    }
    .pill-text {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 600;
      font-size: 13px;
      fill: #e2e8f0;
    }
    .grid-line {
      stroke: #1e293b;
      stroke-width: 1;
      opacity: 0.35;
    }
    .cyber-pulse {
      animation: pulseAnim 4s ease-in-out infinite alternate;
    }
    .beam-flow {
      stroke-dasharray: 10, 15;
      animation: dashMove 12s linear infinite;
    }
    .ring-rotate {
      transform-origin: 1060px 180px;
      animation: rotateRing 25s linear infinite;
    }
    .ring-rotate-reverse {
      transform-origin: 1060px 180px;
      animation: rotateRingRev 35s linear infinite;
    }
    .glow-pulse {
      animation: glowFade 3s ease-in-out infinite alternate;
    }

    @keyframes dashMove {
      to {
        stroke-dashoffset: -250;
      }
    }
    @keyframes rotateRing {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    @keyframes rotateRingRev {
      from { transform: rotate(360deg); }
      to { transform: rotate(0deg); }
    }
    @keyframes glowFade {
      0% { opacity: 0.3; }
      100% { opacity: 0.85; }
    }
    @keyframes pulseAnim {
      0% { transform: scale(0.98); opacity: 0.7; }
      100% { transform: scale(1.02); opacity: 1; }
    }
  </style>

  <!-- Canvas Background -->
  <rect width="1200" height="400" rx="16" fill="url(#bgGrad)" />
  <rect width="1200" height="400" rx="16" fill="none" stroke="#334155" stroke-width="2" />

  <!-- Background Cyber Grid Patterns -->
  <g class="grid-line">
    <line x1="0" y1="80" x2="1200" y2="80" />
    <line x1="0" y1="160" x2="1200" y2="160" />
    <line x1="0" y1="240" x2="1200" y2="240" />
    <line x1="0" y1="320" x2="1200" y2="320" />
    <line x1="200" y1="0" x2="200" y2="400" />
    <line x1="400" y1="0" x2="400" y2="400" />
    <line x1="600" y1="0" x2="600" y2="400" />
    <line x1="800" y1="0" x2="800" y2="400" />
    <line x1="1000" y1="0" x2="1000" y2="400" />
  </g>

  <!-- Ambient Animated Light Beams & Particles (Background Layer Only) -->
  <g opacity="0.4">
    <circle cx="200" cy="80" r="140" fill="#38bdf8" filter="url(#softGlow)" opacity="0.15" />
    <circle cx="1060" cy="180" r="180" fill="#6366f1" filter="url(#softGlow)" opacity="0.2" />
    <circle cx="600" cy="380" r="220" fill="#a855f7" filter="url(#softGlow)" opacity="0.12" />
  </g>

  <!-- Dynamic Animated Graph & Planetary Node (Right Background, Away from Text) -->
  <g>
    <!-- Outer Orbital Rings -->
    <circle class="ring-rotate" cx="1060" cy="180" r="120" fill="none" stroke="#475569" stroke-width="1.5" stroke-dasharray="12 8" />
    <circle class="ring-rotate-reverse" cx="1060" cy="180" r="85" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="6 6" opacity="0.6" />
    <circle cx="1060" cy="180" r="50" fill="#0f172a" stroke="url(#cyberBlue)" stroke-width="2.5" filter="url(#glow)" />
    
    <!-- Central Node Symbol (Scales of Justice / AI Core) -->
    <path d="M 1060 162 L 1060 198 M 1048 170 L 1072 170 M 1048 170 L 1042 186 Q 1048 190 1054 186 Z M 1072 170 L 1066 186 Q 1072 190 1078 186 Z M 1052 198 L 1068 198" 
          stroke="#f8fafc" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none" />

    <!-- Dynamic Flow Beams to Jurisdictions -->
    <path d="M 880 110 C 950 110, 1000 150, 1060 180" fill="none" stroke="#38bdf8" stroke-width="2" class="beam-flow" opacity="0.7" />
    <path d="M 880 250 C 950 250, 1000 210, 1060 180" fill="none" stroke="#818cf8" stroke-width="2" class="beam-flow" opacity="0.7" />
    <path d="M 720 180 L 1010 180" fill="none" stroke="#c084fc" stroke-width="1.5" class="beam-flow" opacity="0.5" />

    <!-- Jurisdiction Satellites -->
    <g class="glow-pulse">
      <circle cx="880" cy="110" r="16" fill="#1e293b" stroke="#38bdf8" stroke-width="2" />
      <text x="880" y="114" font-size="10" font-family="sans-serif" font-weight="700" fill="#38bdf8" text-anchor="middle">US</text>

      <circle cx="880" cy="250" r="16" fill="#1e293b" stroke="#818cf8" stroke-width="2" />
      <text x="880" y="254" font-size="10" font-family="sans-serif" font-weight="700" fill="#818cf8" text-anchor="middle">EU</text>

      <circle cx="970" cy="70" r="14" fill="#1e293b" stroke="#34d399" stroke-width="2" />
      <text x="970" y="74" font-size="9" font-family="sans-serif" font-weight="700" fill="#34d399" text-anchor="middle">UK</text>

      <circle cx="970" cy="290" r="14" fill="#1e293b" stroke="#fbbf24" stroke-width="2" />
      <text x="970" y="294" font-size="9" font-family="sans-serif" font-weight="700" fill="#fbbf24" text-anchor="middle">APAC</text>
    </g>
  </g>

  <!-- FOREGROUND LAYER: Pure High-Contrast Content (Guaranteed Unobscured) -->
  <g transform="translate(60, 0)">
    
    <!-- Top Category Pill -->
    <g transform="translate(0, 52)">
      <rect width="270" height="32" rx="16" fill="#1e293b" stroke="#38bdf8" stroke-width="1.2" opacity="0.95" />
      <circle cx="16" cy="16" r="5" fill="#38bdf8" class="glow-pulse" />
      <text x="32" y="21" class="pill-text" fill="#38bdf8">LEGALTECH &amp; AGENTIC DISCOVERY</text>
    </g>

    <!-- Main Title (Gradient Filled & Layered) -->
    <g transform="translate(0, 135)">
      <text class="title-text" font-size="44" letter-spacing="-1">AUTONOMOUS MULTI-JURISDICTION</text>
      <text class="title-text" y="52" font-size="44" fill="url(#cyberBlue)" letter-spacing="-1">LEGAL DISCOVERY ECOSYSTEM</text>
    </g>

    <!-- Subtitle / Meta Description -->
    <g transform="translate(0, 232)">
      <text class="subtitle-text" font-size="16">
        Curated directory of enterprise SaaS intelligence platforms &amp; open-source eDiscovery engines.
      </text>
      <text class="subtitle-text" y="25" font-size="15" fill="#64748b">
        Cross-border evidence processing, sovereign email archiving, LLM document review &amp; agentic fact investigation.
      </text>
    </g>

    <!-- Feature Attribute Badges (Foreground Bottom) -->
    <g transform="translate(0, 305)">
      <!-- Badge 1: Cross-Border -->
      <g transform="translate(0, 0)">
        <rect width="180" height="38" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1.5" />
        <rect width="180" height="38" rx="8" fill="url(#cyberBlue)" opacity="0.08" />
        <text x="18" y="24" class="pill-text">⚖️ Cross-Border ESI</text>
      </g>

      <!-- Badge 2: Agentic Review -->
      <g transform="translate(192, 0)">
        <rect width="188" height="38" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1.5" />
        <rect width="188" height="38" rx="8" fill="url(#cyberBlue)" opacity="0.08" />
        <text x="18" y="24" class="pill-text">🤖 Agentic Investigation</text>
      </g>

      <!-- Badge 3: Data Sovereignty -->
      <g transform="translate(392, 0)">
        <rect width="176" height="38" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1.5" />
        <rect width="176" height="38" rx="8" fill="url(#cyberBlue)" opacity="0.08" />
        <text x="18" y="24" class="pill-text">🔒 Data Sovereignty</text>
      </g>

      <!-- Badge 4: Open Source -->
      <g transform="translate(580, 0)">
        <rect width="154" height="38" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1.5" />
        <rect width="154" height="38" rx="8" fill="url(#cyberBlue)" opacity="0.08" />
        <text x="18" y="24" class="pill-text">⚡ 100% Defensible</text>
      </g>
    </g>

  </g>
</svg>
